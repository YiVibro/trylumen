<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Dark Mode Background Capsule -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- Deep Slate -->
      <stop offset="100%" stop-color="#020617" /> <!-- Near Black -->
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="lumen-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Neon Cyan -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Electric Blue -->
    </linearGradient>
    
    <linearGradient id="lumen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" /> <!-- Cyber Pink/Red -->
      <stop offset="100%" stop-color="#D946EF" /> <!-- Neon Purple -->
    </linearGradient>
  </defs>

  <!-- Dark Rounded Background so it stands out on light browser tabs -->
  <rect width="32" height="32" rx="8" fill="url(#dark-bg)" />

  <!-- RAG / Data Nodes Base -->
  <circle cx="13" cy="13" r="6" stroke="url(#lumen-cyan)" stroke-width="2.5" fill="none" />
  <circle cx="23" cy="23" r="2.5" fill="url(#lumen-glow)" />
  
  <!-- The "Lumen" Light Beam / Search Handle -->
  <path d="M17.5 17.5L21 21" stroke="url(#lumen-cyan)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- AI Insight Spark -->
  <path d="M15 8L16 6L17 8L19 9L17 10L16 12L15 10L13 9Z" fill="#F59E0B" />
</svg>
